name: بناء تطبيق عزام أي آي

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 1. توليد ملفات الأندرويد
      - name: توليد ملفات المنصات
        run: flutter create . --platforms=android --project-name=azzam_ai --org com.azzam

      # 2. تحديث إصدار Gradle Wrapper إلى 8.7
      - name: تحديث إصدار Gradle
        run: |
          sed -i 's|distributionUrl=.*gradle-.*-all.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      # 3. تحديث إصدار Android Gradle Plugin (AGP) إلى 8.6.0
      - name: تحديث إصدار AGP
        run: |
          sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.6.0" apply false/' android/settings.gradle
          sed -i 's/id "com.android.library" version ".*"/id "com.android.library" version "8.6.0" apply false/' android/settings.gradle

      # 4. تحديث إصدار Kotlin إلى 2.0.21
      - name: تحديث إصدار Kotlin
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.21"/' android/settings.gradle

      # 5. تحديث compileSdk و targetSdk إلى 35
      - name: تحديث compileSdk إلى 35
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle
          # في حال كان الملف بصيغة kotlin
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle.kts || true

      - name: جلب الحزم
        run: flutter pub get

      - name: بناء APK مع حقن المفتاح
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: azzam-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
